<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Encorpa Portal de Dados</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="corner" href="#/home" aria-label="Painel"><img src="logo.svg" alt="" width="56" height="56"></a>
  <header class="hero">
    <h1 class="sr">Encorpa Portal de Dados</h1>
    <img class="wordmark" src="wordmark.svg" alt="" width="420" height="269">
    <span id="updated" class="badge">Sem dados ainda</span>
    <button id="demo" class="demo">Ver exemplo</button>
  </header>

  <div class="sticky">
    <nav class="periods" id="periods" aria-label="Período"></nav>
    <nav class="menu" id="menu" aria-label="Seções"></nav>
  </div>

  <p id="demo-banner" class="banner" hidden></p>
  <main>
    <div id="home">
      <section>
        <h2>Painel geral</h2>
        <div id="status" class="status"></div>
        <div class="kpis" id="kpis"></div>
        <div class="two">
          <div><h3 class="group">Progresso do teste</h3><div id="sample" class="bars"></div></div>
          <div><h3 class="group">Critérios de pausa <small id="pause-sum"></small></h3><div id="pause" class="chips"></div></div>
        </div>
      </section>
      <section>
        <h2>Páginas</h2>
        <div class="tiles" id="tiles"></div>
      </section>
    </div>

    <section id="page" hidden>
      <a class="back" href="#/home">← Voltar ao painel</a>
      <h2 id="page-title"></h2>
      <div id="sector"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
