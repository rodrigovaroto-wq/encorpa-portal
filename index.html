<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a14;--bg2:#0d1426;--card:rgba(18,26,46,.58);--card-b:rgba(255,255,255,.07);--tx:#e8edf7;--tx2:#9aa6bd;--tx3:#67738c;--acc:#2f7bff;--ok:#2fd27a;--warn:#f5b13d;--bad:#ff5c6c;--violet:#9b7bff;--line:rgba(255,255,255,.08);--hover:rgba(255,255,255,.06);--input:rgba(255,255,255,.04);--shadow:0 10px 40px rgba(0,0,0,.35);--r:20px;--orb:.55;--pad:18px}
[data-theme=light]{--bg:#edf1f8;--bg2:#fff;--card:rgba(255,255,255,.74);--card-b:rgba(15,23,42,.08);--tx:#0f172a;--tx2:#55627a;--tx3:#8a96ab;--line:rgba(15,23,42,.08);--hover:rgba(15,23,42,.05);--input:rgba(15,23,42,.035);--shadow:0 10px 30px rgba(15,23,42,.07);--orb:.22}
.compact{--pad:12px;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:var(--orb);pointer-events:none;background:
 radial-gradient(40vw 40vw at 0% 30%,color-mix(in srgb,var(--acc) 70%,transparent),transparent 60%),
 radial-gradient(30vw 30vw at 85% 5%,rgba(255,170,60,.55),transparent 60%),
 radial-gradient(35vw 35vw at 70% 60%,rgba(40,200,190,.35),transparent 60%),
 radial-gradient(25vw 25vw at 40% 45%,rgba(60,200,110,.25),transparent 60%);filter:blur(30px)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
h3{font-size:15px;margin:0;font-weight:600}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:20px 0 8px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--acc);color:#fff;padding:8px 12px;border-radius:8px}
.ic{flex:none}
.sub{color:var(--tx2);font-size:12.5px;margin:2px 0 0}
.muted{color:var(--tx3)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.base{align-items:baseline}
.grow{flex:1}
/* layout */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;border-radius:26px;background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(20px) saturate(140%);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;z-index:40}
.side nav{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:4px 0}
.side hr{width:32px;border:0;border-top:1px solid var(--line);margin:6px 0}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc),#7fb2ff);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 50%,transparent)}
.nv{position:relative;width:50px;height:40px;display:grid;place-items:center;border-radius:14px;color:var(--tx2);transition:.15s}
.nv:hover{background:var(--hover);color:var(--tx)}
.nv.on{background:var(--acc);color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.nv .dot{position:absolute;top:3px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.nv.on .dot{background:#fff;color:var(--acc)}
.sw{width:46px;height:26px;border-radius:13px;background:var(--input);border:1px solid var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--tx2);transition:.2s}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true]::after{left:22px;background:#fff}
#tip{position:fixed;z-index:90;background:var(--bg2);border:1px solid var(--card-b);padding:5px 10px;border-radius:8px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);display:none;white-space:nowrap}
.main{padding:18px 24px 40px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top b{font-size:19px;letter-spacing:-.01em}
.ib.mbtn{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--r);padding:var(--pad);backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--shadow);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kv{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:4px 0}
.kpi .spark{margin-top:8px}
.foot{text-align:center;color:var(--tx3);font-size:12px;margin-top:28px}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;background:var(--input);border:1px solid var(--line);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 40%,transparent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.xs{height:24px;padding:0 9px;font-size:11px}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--input);border:1px solid var(--line);position:relative;flex:none}
.ib:hover{background:var(--hover)}
.ib .dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.seg{display:inline-flex;background:var(--input);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--hover);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs button{padding:10px 14px;font-weight:600;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:9px;background:var(--hover);font-size:11px;margin-left:6px;padding:0 5px;color:var(--tx2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--input);font-size:12.5px;font-weight:600;color:var(--tx2)}
.chip.on{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--tx)}
.inp,.fld input,.fld select,.fld textarea,select.inp{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--input);min-width:0}
.fld textarea{height:auto;padding:10px 12px;resize:vertical}
select option{background:var(--bg2);color:var(--tx)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld>span{font-size:12px;font-weight:600;color:var(--tx2)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.chk input{accent-color:var(--acc);width:16px;height:16px}
/* data */
.delta{font-weight:600;font-size:12.5px}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--hover);color:var(--tx2)}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.info,.pill.acc{color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.pill.violet{color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent)}
.av{--h:210;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:hsl(var(--h) 60% 50% / .22);color:hsl(var(--h) 80% 75%)}
[data-theme=light] .av{color:hsl(var(--h) 60% 35%)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--hover)}
.tbl .r,.r{text-align:right}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.kvl{list-style:none;margin:12px 0;padding:0}
.kvl li{display:flex;justify-content:space-between;padding:6px 0;color:var(--tx2)}
.kvl b{color:var(--tx)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.pager .ib{width:32px;height:32px}
.empty{padding:40px;text-align:center;color:var(--tx3)}
.bar{height:8px;border-radius:4px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 14px}
.stack i{display:block;height:100%}
.sw-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
.lbars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:10px 0}
.lbars i{flex:1;background:color-mix(in srgb,var(--acc) 55%,transparent);border-radius:3px 3px 0 0;transition:height .4s}
.lbars i:last-child{background:var(--acc)}
.rank{width:22px;color:var(--tx3);font-weight:700}
/* charts */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-dasharray:3 5}
.axis{fill:var(--tx3);font-size:11px}
.ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ln.prev{stroke:var(--tx3);stroke-dasharray:6 6;stroke-width:1.6}
.ln.net{stroke:var(--warn)}
.bk{fill:var(--acc);opacity:.85}.bk:hover{opacity:1}
.bk.s1{fill:var(--bad);opacity:.6}
.guide{stroke:var(--tx3);stroke-dasharray:3 3;opacity:0}
.chart:hover .guide{opacity:1}
.tt{position:absolute;pointer-events:none;background:var(--bg2);border:1px solid var(--card-b);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-105%);display:none;z-index:5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:6px}
/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{cursor:pointer;padding:0;overflow:hidden;transition:transform .15s}
.pcard:hover{transform:translateY(-2px)}
.thumb{--h:210;aspect-ratio:4/3;display:grid;place-items:center;font-size:30px;font-weight:700;color:hsl(var(--h) 80% 80%);background:radial-gradient(circle at 30% 30%,hsl(var(--h) 70% 55% / .55),hsl(var(--h) 60% 20% / .4));position:relative}
[data-theme=light] .thumb{color:hsl(var(--h) 60% 30%);background:radial-gradient(circle at 30% 30%,hsl(var(--h) 70% 75%),hsl(var(--h) 60% 88%))}
.thumb .pill{position:absolute;top:10px;left:10px;backdrop-filter:blur(8px)}
.pcard .pb{padding:12px 14px}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--input);border:1px dashed var(--line);border-radius:16px;padding:10px;min-height:300px}
.kcol.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.kh{font-weight:600;margin:4px 4px 10px}
.kcard{background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:grab;display:flex;flex-direction:column;gap:4px}
/* chat & mail */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 210px);min-height:460px;padding:0;overflow:hidden}
.split.three{grid-template-columns:170px 320px minmax(0,1fr)}
.pane{overflow-y:auto;border-right:1px solid var(--line);min-width:0}
.pane:last-child{border-right:0}
.it{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.it:hover{background:var(--hover)}.it.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-size:12.5px}
.it.unread b{color:var(--tx)}.it.unread .t{color:var(--tx)}
.conv{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:9px 13px;border-radius:16px;background:var(--hover)}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff}
.msg small{display:block;opacity:.65;font-size:10.5px;margin-top:3px}
.compose{padding:12px;border-top:1px solid var(--line)}
.fold{display:flex;justify-content:space-between;width:100%;padding:9px 14px;color:var(--tx2);font-weight:600;border-radius:10px}
.fold.on,.fold:hover{background:var(--hover);color:var(--tx)}
.mailbody{white-space:pre-wrap;line-height:1.65}
/* dialogs */
dialog{border:0;padding:0;background:transparent;color:var(--tx);max-width:100vw}
dialog::backdrop{background:rgba(3,6,14,.55);backdrop-filter:blur(4px)}
.mbox{width:min(520px,calc(100vw - 32px));background:var(--bg2);border:1px solid var(--card-b);border-radius:20px;box-shadow:var(--shadow)}
.mbox header,.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mbody{padding:18px;max-height:65vh;overflow-y:auto}
.mbox footer,.df{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh}
.dbox{width:min(460px,100vw);height:100%;background:var(--bg2);border-left:1px solid var(--card-b);display:flex;flex-direction:column}
.db{flex:1;overflow-y:auto;padding:18px}
.big{font-size:22px}
.tl{list-style:none;padding:0;margin:0}
.tl li{position:relative;padding:0 0 14px 22px;color:var(--tx3)}
.tl li::before{content:"";position:absolute;left:4px;top:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--tx3)}
.tl li.done{color:var(--tx)}.tl li.done::before{background:var(--ok);border-color:var(--ok)}
[popover]{inset:auto;top:64px;right:24px;margin:0;width:min(360px,calc(100vw - 32px));background:var(--bg2);color:var(--tx);border:1px solid var(--card-b);border-radius:16px;box-shadow:var(--shadow);padding:6px}
#createMenu{width:240px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.mi:hover{background:var(--hover)}
.mi.unread{background:color-mix(in srgb,var(--acc) 8%,transparent)}
#pal .mbox{width:min(600px,calc(100vw - 32px))}
#pal input{width:100%;height:52px;border:0;background:transparent;padding:0 18px;font-size:16px;border-bottom:1px solid var(--line);outline:0}
#palres{max-height:50vh;overflow-y:auto;padding:6px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--bg2);border:1px solid var(--card-b);padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);transition:transform .25s;z-index:100;font-weight:500}
#toast.show{transform:translate(-50%,0)}
details{border-bottom:1px solid var(--line);padding:12px 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--tx3)}details[open] summary::after{content:"–"}
details p{color:var(--tx2);margin:8px 0 0}
.hcat{cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.hcat:hover{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.icbox{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);flex:none}
.prog{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc)}
.acc-opt{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.acc-opt.on{border-color:var(--tx)}
/* responsive */
@media(max-width:1150px){.s3,.s4,.s5{grid-column:span 6}.s7,.s8{grid-column:span 12}.split.three{grid-template-columns:150px 260px minmax(0,1fr)}}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:-110px;top:0;height:100vh;margin:0;border-radius:0 24px 24px 0;transition:left .2s}
 .side.open{left:0}
 .ib.mbtn{display:grid}
 .main{padding:14px 16px 32px}
 .s3,.s4,.s5,.s6{grid-column:span 12}
 .split,.split.three{grid-template-columns:1fr;height:auto}
 .split .pane{max-height:340px;border-right:0;border-bottom:1px solid var(--line)}
 .r2{grid-template-columns:1fr}
 .top .hide-sm{display:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<div class="app">
  <aside class="side" id="side" aria-label="Menu lateral"></aside>
  <div class="main">
    <header class="top">
      <div class="row">
        <button class="ib mbtn" data-act="menu" aria-label="Abrir menu"></button>
        <div><b id="greet"></b><div class="sub" id="crumb"></div></div>
      </div>
      <div class="row">
        <button class="ib" data-act="palette" aria-label="Buscar (Ctrl+K)" data-tip="Buscar · Ctrl+K" id="topSearch"></button>
        <button class="ib" popovertarget="notif" aria-label="Notificações" id="bell"></button>
        <button class="btn pri" popovertarget="createMenu" id="createBtn"></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div popover id="notif"></div>
<div popover id="createMenu"></div>
<dialog id="modal"></dialog>
<dialog id="drawer" class="drawer"></dialog>
<dialog id="pal"><div class="mbox"><input id="palq" placeholder="Buscar páginas, pedidos, clientes, produtos…" autocomplete="off"><div id="palres"></div></div></dialog>
<div id="tip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

let CH = {}, chSeq = 0;
function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function lineChart({ labels, series, h = 260, fmt = kfmt, tfmt = brl0 }) {
  const W = 800, H = h, pl = 56, pr = 14, pt = 12, pb = 30, n = labels.length;
  const max = niceMax(Math.max(...series.flatMap(s => s.data)));

  const id = 'c' + (chSeq++);

  const step = Math.ceil(n / 8);
  labels.forEach((l, i) => { if (i % step === 0) g += `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  const paths = series.map((s, si) => {
    const d = s.data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
    return (si === 0 ? `<path d="${d}L${x(n - 1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="url(#g${id})"/>` : '') + `<path class="ln ${s.cls || ''}" d="${d}"/>`;
  }).reverse().join('');
  CH[id] = { labels, series, tfmt, W, pl, pr, n, x, y, H };

function barChart({ labels, series, line, h = 240, fmt = kfmt, tfmt = brl0 }) {

  const step = Math.ceil(n / 10);

  series.forEach((s, si) => s.data.forEach((v, i) => {

VIEWS.products = () => {
  const v = V.products, now = Date.now(), sold = units(now - 30 * DAY, now), low = lowStock();

  const actions = `<button class="btn pri" data-act="new" data-m="product">${ic('plus', 16)} Novo produto</button>`;
  const stockPill = p => p.stock === 0 ? pill('Esgotado', 'bad') : p.stock <= p.reorder ? pill('Estoque baixo', 'warn') : pill(p.stock + ' em estoque');
  let body;

    body = `<div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Produto</th><th class="r">Estoque</th><th class="r">Ponto de reposição</th><th class="r">Vendidos 30 d</th><th class="r">Cobertura</th><th>Situação</th><th></th></tr></thead><tbody>${rows.map(({ p, i, s, cover }) => `<tr><td><b>${esc(p.name)}</b><div class="sub">${esc(p.cat)} · ${esc(p.variant)}</div></td><td class="r">${p.stock}</td><td class="r">${p.reorder}</td><td class="r">${s}</td><td class="r">${cover === Infinity ? '—' : Math.floor(cover) + ' dias'}</td><td>${stockPill(p)}</td><td class="r"><button class="btn xs" data-act="new" data-m="restock" data-i="${i}">Repor</button> <button class="btn xs ghost" data-act="new" data-m="product" data-i="${i}">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`;
  } else if (v.tab === 'collections') {
    body = `<div class="grid">${cats.map(c => { const ps = S.products.map((p, i) => ({ p, i })).filter(x => x.p.cat === c); return `<button class="card s4 hcat" data-act="cat" data-v="${esc(c)}" style="text-align:left"><span class="thumb" style="--h:${hue(c)};width:56px;aspect-ratio:1;border-radius:14px;font-size:18px">${esc(c.slice(0, 2))}</span><span><h3>${esc(c)}</h3><span class="sub">${ps.length} produtos · ${sum(ps.map(x => sold[x.i]))} vendidos em 30 dias<br>Estoque avaliado em ${brl0(sum(ps.map(x => x.p.stock * x.p.price)))}</span></span></button>`; }).join('')}</div>`;
  } else {
    const q = v.q.trim().toLowerCase();

VIEWS.analytics = () => {
  const v = V.analytics, now = Date.now(), t0 = sod(now);
  const actions = `<button class="btn" data-act="new" data-m="report">${ic('mail', 16)} Enviar relatório</button>`;
  let body;
  if (v.tab === 'visitors') {
    const days = [...Array(30)].map((_, i) => t0 - (29 - i) * DAY);
    const vis = days.map(a => visitors(a, a + DAY)), visP = days.map(a => visitors(a - 30 * DAY, a - 29 * DAY));
    const tv = sum(vis), tvP = sum(visP), o = cnt(now - 30 * DAY, now), r30 = rev(now - 30 * DAY, now);
    const SRC = [['Busca orgânica', 38], ['Instagram', 24], ['Direto', 18], ['Google Ads', 12], ['E-mail', 8]];
    const u = units(now - 30 * DAY, now).map((x, i) => ({ x, i })).sort((a, b) => b.x - a.x).slice(0, 6);
    body = `<div class="grid">
      ${[['Visitantes', num(tv), delta(tv, tvP)], ['Conversão', (o / tv * 100).toFixed(2).replace('.', ',') + '%', ''], ['Pedidos', num(o), ''], ['Receita por visitante', brl(r30 / tv), '']].map(([l, val, d]) => `<div class="card s3"><div class="sub">${l}</div><div class="kv">${val}</div><div class="row">${d}<span class="sub">últimos 30 dias</span></div></div>`).join('')}
      <section class="card s12"><div class="ch"><div><h3>Visitantes por dia</h3><p class="sub">Últimos 30 dias vs 30 dias anteriores</p></div></div>${lineChart({ labels: days.map(dm), series: [{ name: 'Atual', data: vis }, { name: 'Anterior', data: visP, cls: 'prev' }], fmt: x => num(Math.round(x)), tfmt: x => num(x) })}</section>
      <section class="card s6"><h3>Origem do tráfego</h3><ul class="list" style="margin-top:10px">${SRC.map(([n, p]) => `<li><span style="width:130px">${n}</span><div class="bar grow"><i style="width:${p / .4}%"></i></div><b style="width:90px;text-align:right">${num(Math.round(tv * p / 100))}</b></li>`).join('')}</ul></section>
      <section class="card s6"><h3>Produtos mais vistos</h3><ul class="list" style="margin-top:10px">${u.map(({ x, i }) => `<li><span>${esc(S.products[i].name)}</span><b>${num(x * 37)} visitas</b></li>`).join('')}</ul></section></div>`;
  } else if (v.tab === 'funnel') {
    const tv = visitors(now - 30 * DAY, now), o = cnt(now - 30 * DAY, now);
    const steps = [['Visitaram a loja', tv], ['Viram um produto', Math.round(tv * .52)], ['Adicionaram ao carrinho', Math.round(tv * .11)], ['Iniciaram o checkout', Math.round(tv * .046)], ['Compraram', o]];
    body = `<section class="card"><div class="ch"><div><h3>Funil de checkout</h3><p class="sub">Últimos 30 dias · onde as pessoas desistem</p></div></div>
      ${steps.map(([l, n], i) => `<div style="margin:14px 0"><div class="row between"><b>${l}</b><span>${num(n)} <span class="sub">${(n / tv * 100).toFixed(1).replace('.', ',')}%</span>${i ? ` <span class="delta down">−${(100 - n / steps[i - 1][1] * 100).toFixed(0)}% da etapa anterior</span>` : ''}</span></div><div class="bar" style="height:14px;margin-top:6px"><i style="width:${Math.max(1, n / tv * 100)}%"></i></div></div>`).join('')}</section>`;
  } else {
    const p60 = [now - 60 * DAY, now], p120 = [now - 120 * DAY, now - 60 * DAY];
    const R = rev(...p60), Rp = rev(...p120), O = cnt(...p60), Op = cnt(...p120), U = sum(units(...p60)), Up = sum(units(...p120));
    let labels, data;
    if (v.range === '30') { const d = [...Array(30)].map((_, i) => t0 - (29 - i) * DAY); labels = d.map(dm); data = d.map(a => rev(a, a + DAY)); }
    else if (v.range === '90') { const d = [...Array(13)].map((_, i) => t0 - (12 - i) * 7 * DAY - 6 * DAY); labels = d.map(dm); data = d.map(a => rev(a, a + 7 * DAY)); }
    else { const B = buckets('12M'); labels = B.map(b => b.l); data = B.map(b => rev(b.a, b.b)); }
    const B13 = buckets('13M').reverse();
    body = `<div class="grid">
      ${[['Receita', brl0(R), delta(R, Rp)], ['Pedidos', num(O), delta(O, Op)], ['Ticket médio', brl(R / O || 0), delta(R / O, Rp / Op)], ['Unidades', num(U), delta(U, Up)]].map(([l, val, d]) => `<div class="card s3"><div class="sub">${l}</div><div class="kv">${val}</div><div class="row">${d}<span class="sub">últimos 60 dias</span></div></div>`).join('')}
      <section class="card s12"><div class="ch"><div><h3>Receita</h3><p class="sub">${{ 30: 'Por dia, últimos 30 dias', 90: 'Por semana, últimas 13 semanas', 365: 'Por mês, últimos 12 meses' }[v.range]}</p></div>${seg('analytics.range', [['30', '30 dias'], ['90', '90 dias'], ['365', '12 meses']], v.range)}</div>${barChart({ labels, series: [{ name: 'Receita', data }] })}</section>
      <section class="card s12"><div class="ch"><div><h3>Mês a mês</h3><p class="sub">Receita válida, sem devoluções e cancelamentos</p></div></div><div class="tw"><table class="tbl"><thead><tr><th>Mês</th><th class="r">Receita</th><th class="r">Pedidos</th><th class="r">Ticket médio</th><th class="r">vs ano anterior</th></tr></thead><tbody>
      ${B13.map((b, i) => { const r = rev(b.a, b.b), o = cnt(b.a, b.b), ry = rev(yrBack(b.a), yrBack(b.b)); return `<tr><td><b>${cap(new Date(b.a).toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }).replace('.', ''))}</b>${i === 0 ? ' <span class="sub">· parcial</span>' : ''}</td><td class="r">${brl0(r)}</td><td class="r">${num(o)}</td><td class="r">${brl(o ? r / o : 0)}</td><td class="r">${delta(r, ry)}</td></tr>`; }).join('')}</tbody></table></div></section></div>`;
  }
  return head('Análises', 'O que vendeu, quem visitou e onde o checkout perde gente.', actions) + tabs('analytics.tab', [['sales', 'Vendas'], ['visitors', 'Visitantes'], ['funnel', 'Funil de checkout']], v.tab) + body;
};

function monthRange(back) { const d = new Date(); return [+new Date(d.getFullYear(), d.getMonth() - back, 1), +new Date(d.getFullYear(), d.getMonth() - back + 1, 1)]; }

  const d = $('#modal');

  d.querySelector('form').onsubmit = e => { e.preventDefault(); if (onOk(Object.fromEntries(new FormData(e.target)), e.target) !== false) d.close(); };
  d.showModal();
}

function setStatus(id, st) {
  const o = S.orders.find(x => x.id === id); if (!o || o.st === st) return;
  const back = ['devolvido', 'cancelado'];
  if (back.includes(st) && !back.includes(o.st)) o.i.forEach(([p, q]) => S.products[p].stock += q);
  o.st = st;
}

/* ---------- ações ---------- */
function commit(msg) { save(); render(); if (msg) toast(msg); }
const ACT = {
  set: d => { const [k, p] = d.k.split('.'); if (k === 'theme') { S.theme = d.v; applyTheme(); return commit(); } V[k][p] = /^\d+$/.test(d.v) && p === 'cur' && k === 'email' ? +d.v : d.v; if (p !== 'page') V[k].page = 1; if (p !== 'sel' && k === 'orders') V.orders.sel = []; render(); },
  toggle: d => { const [k, p] = d.k.split('.'); V[k][p] = !V[k][p]; render(); },
  page: d => { V[d.k].page = +d.v; render(); },
  go: d => { if (d.tab) V[d.to].tab = d.tab; $('#notif').hidePopover?.(); location.hash = '#/' + d.to; if (location.hash === '#/' + d.to) render(); },
  new: d => { $('#createMenu').hidePopover?.(); M[d.m](d); },
  order: d => openOrder(d.id),
  customer: d => openCustomer(d.id),
  ost: d => { setStatus(d.id, d.s); commit(`${d.id}: ${ST[d.s][0].toLowerCase()}`); if ($('#drawer').open && $('#drawer h3')?.textContent.includes(d.id)) openOrder(d.id); },
  bulk: d => { V.orders.sel.forEach(id => setStatus(id, d.s)); const n = V.orders.sel.length; V.orders.sel = []; commit(`${n} pedidos atualizados`); },
  clearSel: () => { V.orders.sel = []; render(); },
  close: () => { $('#modal').open && $('#modal').close(); $('#drawer').open && $('#drawer').close(); },
  menu: () => $('#side').classList.toggle('open'),
  theme: () => { S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); commit(); },
  accent: d => { S.settings.accent = d.v; applyTheme(); commit('Cor atualizada'); },
  palette: () => openPalette(),
  cat: d => { V.products.tab = 'catalog'; V.products.cat = d.v; render(); },
  seg: d => { V.customers.tab = 'people'; V.customers.seg = d.v; render(); },
  review: d => { S.reviews[+d.i].status = d.s; commit(d.s === 'publicada' ? 'Avaliação publicada' : 'Avaliação ocultada'); },
  inv: d => { const i = S.invoices.find(x => x.id === d.id); if (d.s === 'lembrar') { i.reminded = true; return commit(`Lembrete enviado para ${cmap()[i.c].name}`); } if (d.s === 'paga') i.paidAt = Date.now(); if (d.s === 'enviada') { i.issued = Date.now(); i.due = Date.now() + 14 * DAY; } i.status = d.s; commit(`${i.id} ${d.s === 'paga' ? 'marcada como paga' : 'enviada'}`); },
  coupon: d => { const c = S.coupons[+d.i]; c.active = !c.active; commit(`${c.code} ${c.active ? 'ativado' : 'pausado'}`); },
  copy: d => { navigator.clipboard?.writeText(d.v).then(() => toast(`${d.v} copiado`), () => toast(d.v)); },
  delExpense: d => { if (!confirm('Excluir esta despesa?')) return; S.expenses = S.expenses.filter(e => e.id !== +d.id); commit('Despesa excluída'); },
  delMember: d => { if (!confirm(`Remover ${S.team[+d.i].name} da equipe?`)) return; S.team.splice(+d.i, 1); commit('Acesso removido'); },
  app: d => { const a = S.apps[+d.i]; if (a.inst && !confirm(`Remover ${a.name}? Seus dados continuam salvos.`)) return; a.inst = !a.inst; commit(`${a.name} ${a.inst ? 'instalado' : 'removido'}`); },
  chatOpen: d => { const c = S.chats.find(x => x.id === d.id); c.open = !c.open; V.chats.tab = c.open ? 'open' : 'closed'; commit(c.open ? 'Conversa reaberta' : 'Conversa encerrada'); },
  quick: d => { const i = $('.compose input'); i.value = d.v; i.focus(); },
  mail: d => { const m = S.mails.find(x => x.id === +d.id); if (d.op === 'star') m.star = !m.star; else { m.f = 'archive'; V.email.cur = null; } commit(d.op === 'archive' ? 'Arquivado' : ''); },
  readAll: () => { S.notifRead = notifs().map(n => n.id); save(); renderNav(); },
  notif: d => { S.notifRead.push(d.id); save(); $('#notif').hidePopover?.(); ACT.go(d); },
  exportOrders: d => {
    const cm = cmap(), list = d.sel ? S.orders.filter(o => V.orders.sel.includes(o.id)) : d.all ? S.orders : (V._ordersList || S.orders);
    download('pedidos.csv', csv([['Pedido', 'Data', 'Cliente', 'E-mail', 'Canal', 'Itens', 'Frete', 'Total', 'Status'], ...list.map(o => [o.id, new Date(o.ts).toLocaleString('pt-BR'), cm[o.c].name, cm[o.c].email, o.ch, nItems(o), o.ship.toFixed(2).replace('.', ','), o.total.toFixed(2).replace('.', ','), ST[o.st][0]])]));
    toast(`${num(list.length)} pedidos exportados`);
  },
  exportCustomers: () => { const st = custStats(); download('clientes.csv', csv([['Nome', 'E-mail', 'Cidade', 'Segmento', 'Pedidos', 'Total gasto'], ...S.customers.map(c => [c.name, c.email, c.city, st[c.id].seg, st[c.id].n, st[c.id].spent.toFixed(2).replace('.', ',')])])); },
  exportJson: () => download('backup-portal.json', JSON.stringify(S), 'application/json'),
  reset: () => { if (!confirm('Restaurar todos os dados de demonstração? Suas alterações serão perdidas.')) return; S = seed(); applyTheme(); commit('Dados restaurados'); },
};

/* ---------- notificações, menu criar, paleta ---------- */
function notifs() {
  const n = [], cm = cmap();
  S.products.filter(p => p.stock === 0 && p.status === 'ativo').forEach(p => n.push({ id: 'st-' + p.name, icon: 'box', t: `${p.name} esgotado`, s: 'Repor estoque', to: 'products', tab: 'stock' }));
  S.invoices.filter(i => invStatus(i) === 'vencida').forEach(i => n.push({ id: 'inv-' + i.id, icon: 'file', t: `${i.id} vencida`, s: `${cm[i.c].name} · ${brl0(i.amount)}`, to: 'invoices' }));
  S.chats.filter(c => c.unread).forEach(c => n.push({ id: 'chat-' + c.id + c.msgs.length, icon: 'chat', t: `Nova mensagem de ${c.name}`, s: c.msgs[c.msgs.length - 1][1], to: 'chats' }));
  S.orders.filter(o => o.st === 'separar').slice(-3).forEach(o => n.push({ id: 'ord-' + o.id, icon: 'bag', t: `Pedido ${o.id} pago`, s: `${cm[o.c].name} · ${brl(o.total)}`, to: 'orders', tab: 'board' }));
  return n;
}
function renderNav() {
  const r = route(), unread = notifs().filter(n => !S.notifRead.includes(n.id));
  const badge = { orders: S.orders.filter(o => o.st === 'separar').length, products: lowStock().length, chats: sum(S.chats.map(c => c.unread)), email: S.mails.filter(m => m.f === 'inbox' && !m.read).length };
  $('#side').innerHTML = `<a class="logo" href="#/dashboard" aria-label="Início" data-tip="${esc(S.settings.name)}">${ic('logo', 22)}</a><button class="nv" data-act="palette" data-tip="Buscar · Ctrl+K" aria-label="Buscar">${ic('search')}</button><hr>
   <nav aria-label="Principal">${NAV.map(([g, items], gi) => (gi ? '<hr>' : '') + items.map(([k, icn]) => `<a class="nv ${r === k ? 'on' : ''}" href="#/${k}" data-tip="${g ? g + ' · ' : ''}${TITLES[k]}" aria-label="${TITLES[k]}" ${r === k ? 'aria-current="page"' : ''}>${ic(icn, 19)}${badge[k] ? `<span class="dot">${badge[k]}</span>` : ''}</a>`).join('')).join('')}</nav>
   <button class="sw" role="switch" aria-checked="${document.documentElement.dataset.theme === 'dark'}" aria-label="Modo escuro" data-act="theme" data-tip="Modo escuro"></button>
   <a class="nv" href="#/settings" data-tip="${esc(S.user.name)} · ${esc(S.user.role)}" aria-label="Conta">${av(S.user.name)}</a>`;
  $('#bell').innerHTML = ic('bell') + (unread.length ? `<span class="dot">${unread.length}</span>` : '');
  $('#notif').innerHTML = `<div class="row between" style="padding:8px 10px"><b>Notificações</b>${unread.length ? '<button class="btn xs" data-act="readAll">Marcar todas como lidas</button>' : ''}</div>${notifs().map(n => `<button class="mi ${S.notifRead.includes(n.id) ? '' : 'unread'}" data-act="notif" data-id="${esc(n.id)}" data-to="${n.to}" ${n.tab ? `data-tab="${n.tab}"` : ''}><span class="icbox">${ic(n.icon, 16)}</span><span style="min-width:0"><b>${esc(n.t)}</b><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px">${esc(n.s)}</div></span></button>`).join('') || '<p class="empty">Tudo em dia.</p>'}`;
}
function openPalette() {
  const d = $('#pal'), inp = $('#palq'); inp.value = ''; palRender(''); d.showModal(); inp.focus();
}
function palItems(q) {
  q = q.trim().toLowerCase(); const out = [];
  Object.entries(TITLES).forEach(([k, t]) => { if (!q || t.toLowerCase().includes(q)) out.push({ ic: 'arrow', t, s: 'Página', act: `data-act="go" data-to="${k}"` }); });
  if (q) {
    const cm = cmap();
    S.orders.filter(o => o.id.toLowerCase().includes(q)).slice(-5).reverse().forEach(o => out.push({ ic: 'bag', t: `Pedido ${o.id}`, s: `${cm[o.c].name} · ${brl(o.total)}`, act: `data-act="order" data-id="${o.id}"` }));
    S.customers.filter(c => c.name.toLowerCase().includes(q)).slice(0, 5).forEach(c => out.push({ ic: 'users', t: c.name, s: 'Cliente · ' + c.city, act: `data-act="customer" data-id="${c.id}"` }));
    S.products.map((p, i) => ({ p, i })).filter(({ p }) => p.name.toLowerCase().includes(q)).slice(0, 5).forEach(({ p, i }) => out.push({ ic: 'box', t: p.name, s: 'Produto · ' + brl(p.price), act: `data-act="new" data-m="product" data-i="${i}"` }));
  }
  return out;
}
function palRender(q) { const it = palItems(q); $('#palres').innerHTML = it.map((x, i) => `<button class="mi ${i === 0 ? 'unread' : ''}" ${x.act}>${ic(x.ic, 16)}<span><b>${esc(x.t)}</b> <span class="sub">${esc(x.s)}</span></span></button>`).join('') || '<p class="empty">Nada encontrado.</p>'; }
$('#palq').addEventListener('input', e => palRender(e.target.value));
$('#palq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#palres .mi')?.click(); } });
$('#pal').addEventListener('click', e => { if (e.target === $('#pal') || e.target.closest('.mi')) $('#pal').close(); });

/* ---------- roteador e eventos ---------- */
const route = () => { const r = (location.hash.match(/^#\/(\w+)/) || [])[1]; return VIEWS[r] ? r : 'dashboard'; };
function greet() { const h = new Date().getHours(); return (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', ' + S.user.name.split(' ')[0]; }
function render() {
  const r = route(), a = document.activeElement, fid = a?.dataset?.bind, pos = a?.selectionStart;
  CH = {};
  $('#main').innerHTML = VIEWS[r]();
  document.title = `${TITLES[r]} — ${S.settings.name}`;
  $('#greet').textContent = greet();
  $('#crumb').textContent = cap(new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })) + ' · ' + TITLES[r];
  renderNav();
  if (fid) { const el = $(`[data-bind="${fid}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch { /* select */ } } }
  const msgs = $('#msgs'); if (msgs) msgs.scrollTop = msgs.scrollHeight;
}
function applyTheme() {
  const t = S.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.theme;
  document.documentElement.dataset.theme = t;
  document.documentElement.style.setProperty('--acc', S.settings.accent);
  document.body.classList.toggle('compact', !!S.settings.compact);
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) { if ($('#side').classList.contains('open') && !e.target.closest('#side, .mbtn')) $('#side').classList.remove('open'); return; }
  if (e.target.closest('input[type=checkbox]')) return;
  if (a.tagName === 'A' && !a.dataset.act) return;
  e.preventDefault(); ACT[a.dataset.act]?.(a.dataset, a, e);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Enter' && e.target.matches('.pcard')) e.target.click();
});
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset.bind;
  if (b) { const [k, p] = b.split('.'); V[k][p] = t.value; V[k].page = 1; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.selo) { const s = new Set(V.orders.sel); t.checked ? s.add(t.dataset.selo) : s.delete(t.dataset.selo); V.orders.sel = [...s]; render(); }
  if (t.dataset.team) { S.team[+t.dataset.team].role = t.value; commit('Papel atualizado'); }
  if (t.dataset.notify) { S.settings.notify[t.dataset.notify] = t.checked; commit('Preferência salva'); }
  if (t.dataset.setting === 'compact') { S.settings.compact = t.checked; applyTheme(); commit(); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'storeForm') { e.preventDefault(); const d = Object.fromEntries(new FormData(f)); Object.assign(S.settings, d, { freeShip: +d.freeShip, goal: +d.goal }); commit('Configurações salvas'); }
  if (f.id === 'supportForm') { e.preventDefault(); const d = Object.fromEntries(new FormData(f)); S.tickets.unshift({ ...d, ts: Date.now() }); commit('Mensagem enviada ao suporte'); }
  if (f.dataset.chat) { e.preventDefault(); const t = f.t.value.trim(); if (!t) return; S.chats.find(c => c.id === f.dataset.chat).msgs.push([1, t, Date.now()]); commit(); $('.compose input')?.focus(); }
});
// arrastar e soltar no quadro de separação
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if (c) e.dataTransfer.setData('text/plain', c.dataset.drag); });
document.addEventListener('dragover', e => { const col = e.target.closest?.('[data-drop]'); if (col) { e.preventDefault(); $$('.kcol').forEach(k => k.classList.toggle('over', k === col)); } });
document.addEventListener('drop', e => { const col = e.target.closest?.('[data-drop]'); if (!col) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); setStatus(id, col.dataset.drop); commit(`${id}: ${ST[col.dataset.drop][0].toLowerCase()}`); });
// tooltip do menu lateral
document.addEventListener('mouseover', e => { const t = e.target.closest?.('[data-tip]'), tip = $('#tip'); if (!t) { tip.style.display = 'none'; return; } const r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.style.display = 'block'; const side = t.closest('.side'); tip.style.left = (side ? r.right + 10 : r.left + r.width / 2 - tip.offsetWidth / 2) + 'px'; tip.style.top = (side ? r.top + r.height / 2 - tip.offsetHeight / 2 : r.bottom + 8) + 'px'; });
window.addEventListener('hashchange', () => { $('#tip').style.display = 'none'; render(); scrollTo(0, 0); $('#side').classList.remove('open'); $('#main').focus({ preventScroll: true }); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.theme === 'system' && (applyTheme(), renderNav()));
// loja ao vivo — ponytail: valores simulados; ligar ao analytics real (websocket/polling)
setInterval(() => {
  LIVE.v = Math.max(8, Math.min(120, LIVE.v + Math.round((Math.random() - 0.5) * 8))); LIVE.c = Math.max(1, Math.round(LIVE.v / 5 + (Math.random() - 0.5) * 3));
  LIVE.bars.push(Math.min(100, LIVE.v)); LIVE.bars.shift();
  if ($('#live-v')) { $('#live-v').textContent = LIVE.v; $('#live-c').textContent = LIVE.c; $('#live-bars').innerHTML = LIVE.bars.map(b => `<i style="height:${b}%"></i>`).join(''); }
}, 3000);

/* ---------- init ---------- */
$('.mbtn').innerHTML = ic('menu');
$('#topSearch').innerHTML = ic('search');
$('#createBtn').innerHTML = ic('plus', 16) + ' Criar';
$('#createMenu').innerHTML = [['order', 'bag', 'Novo pedido'], ['product', 'box', 'Novo produto'], ['customer', 'users', 'Novo cliente'], ['invoice', 'file', 'Nova fatura'], ['coupon', 'tag', 'Novo cupom'], ['expense', 'wallet', 'Nova despesa'], ['compose', 'mail', 'Novo e-mail']].map(([m, i, l]) => `<button class="mi" data-act="new" data-m="${m}">${ic(i, 16)} ${l}</button>`).join('');
applyTheme();
render();
</script>
</body>
</html>
