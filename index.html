<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Encorpa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Parisienne&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="Encorpa" class="logo">
      <h1><span class="script">Portal</span> de análise</h1>
    </div>
    <span id="updated" class="badge">Sem dados ainda</span>
  </header>

  <nav class="periods" id="periods" aria-label="Período"></nav>

  <main>
    <section>
      <h2>Métricas</h2>
      <div class="grid" id="metrics"></div>
    </section>

    <section>
      <h2>Comparação entre períodos</h2>
      <div class="table-wrap">
        <table id="compare">
          <thead><tr><th>Métrica</th><th>Período atual</th><th>Período anterior</th><th>Variação</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Quando pausar</h2>
      <ul class="pause" id="pause"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
