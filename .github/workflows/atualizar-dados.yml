name: Atualizar dados
on:
  # Disparo automático desligado: no Vercel, a função api/data.js já atualiza a cada 30 min.
  # Para ligar de novo (exige cobrança do GitHub Actions em dia): schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch: {}       # botão "Run workflow" para testar
permissions:
  contents: write
concurrency: { group: atualizar-dados, cancel-in-progress: false }
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Gerar data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/build-data.mjs
      - name: Guardar no repositório
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Atualizar dados" && git push)
