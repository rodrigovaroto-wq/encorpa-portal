name: Verificação
# Em todo push e pull request: build, testes das contas e das APIs, e a tela Conversas no navegador.
# O mesmo roda no computador com `npm run check`.
# Só comandos do próprio runner, sem actions de terceiros (checkout e setup-node): as execuções com elas
# morriam antes do primeiro passo, sem log (19/10).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Código
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Node 22
        run: |
          dir=$(ls -d /opt/hostedtoolcache/node/22.*/x64 2>/dev/null | sort -V | tail -1)
          if [ -n "$dir" ]; then echo "$dir/bin" >> "$GITHUB_PATH"; fi
      - run: node -v && npm -v
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
